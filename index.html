<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語音辨識訓練系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #F5F0F2;
  --card:     #ffffff;
  --border:   #D4BEC8;

  --ui-dark:   #4A3040;
  --ui-purple: #7B6079;
  --ui-mauve:  #D4BEC8;
  --ui-light:  #F5F0F2;

  --ink:  #4A3040;
  --ink2: #7B6079;
  --ink3: #B09AA8;

  --asp-big:  #C06C7E;
  --asp-sub:  #EFC4CC;
  --asp-sub-text: #7a2030;

  --pos-big:  #5E8F8A;
  --pos-sub:  #BBDCD8;
  --pos-sub-text: #2a5e5a;

  --r: 16px; --r-sm: 10px; --r-xs: 6px;
  --sh:  0 3px 16px rgba(53,56,102,.09);
  --shh: 0 7px 28px rgba(53,56,102,.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Times New Roman', 'Noto Serif TC', serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 17px;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 全程式字體：中文使用思源宋體；英文字母與數字使用 Times New Roman */
body, body * {
  font-family: 'Times New Roman', 'Noto Serif TC', serif !important;
}


/* ── TABS ── */
.tabs {
  display: flex;
  background: #7B6079;
  border-bottom: 3px solid #5a4058;
  position: sticky; top: 0; z-index: 50;
  padding: 0;
}
.tab {
  flex: 1; padding: 18px 8px; font-size: 16px; font-weight: 700;
  color: #e8d8e8; cursor: pointer; text-align: center;
  border-bottom: 4px solid transparent; margin-bottom: -3px;
  transition: all .18s; white-space: nowrap;
  font-family: inherit; background: none;
  border-top: none; border-left: none; border-right: none;
}
.tab:hover { color: #fff; }
.tab.active { color: #fff; border-bottom-color: #F4D06F; }

/* ── SCREENS ── */
.screen { display: none; padding: 36px 32px; animation: fi .2s ease; max-width: 1100px; margin: 0 auto; }
.screen.active { display: block; flex: 1 0 auto; }
@keyframes fi { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }

/* ── LANDING ── */
.landing-btn {
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 18px 24px;
  border: 2.5px solid var(--border);
  border-radius: var(--r); cursor: pointer; font-family: inherit;
  text-align: left; transition: all .18s; box-shadow: var(--sh);
}
.landing-btn:hover { transform: translateY(-2px); box-shadow: var(--shh); }
.landing-btn-text { flex: 1; font-size: 18px; font-weight: 700; }
.landing-btn-arrow { font-size: 24px; font-weight: 300; }

/* ── PROFILE ── */
.pcard {
  background: var(--card); border-radius: var(--r);
  box-shadow: var(--sh); padding: 32px; border: 2px solid var(--border);
}
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
.frow.full { grid-template-columns: 1fr; }
.fl { font-size: 15px; font-weight: 700; color: var(--ink2); margin-bottom: 7px; letter-spacing: .05em; text-transform: uppercase; }
.fi {
  width: 100%; padding: 10px 16px; font-size: 17px;
  border: 2.5px solid var(--border); border-radius: var(--r-sm);
  background: var(--bg); color: var(--ink); font-family: inherit;
  outline: none; transition: border .15s; height: 52px; 
  -webkit-appearance: none; appearance: none; line-height: normal;
}
.fi:focus { border-color: #7B6079; background: #fff; }
.go-btn {
  width: 100%; margin-top: 24px; padding: 18px;
  font-size: 16px; font-weight: 700; font-family: inherit;
  background: #7B6079; color: #fff; border: none;
  border-radius: var(--r-sm); cursor: pointer; transition: all .18s;
}
.go-btn:hover { opacity: .88; transform: translateY(-2px); }

.toggle-group { display: flex; gap: 10px; height: 52px; }
.toggle-btn {
  flex: 1; display: flex; align-items: center; justify-content: center;
  border: 2.5px solid var(--border); border-radius: var(--r-sm);
  background: var(--bg); color: var(--ink); font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all 0.15s; user-select: none;
}
.toggle-btn:hover { border-color: #7B6079; background: #fff; }
.toggle-btn.active { border-color: #7B6079; background: #7B6079; color: #fff; }

@media (max-width: 768px) {
  .frow { grid-template-columns: 1fr; gap: 14px; }
  .screen { padding: 24px 16px; }
}

/* ── HOME ── */
.pbar {
  background: #F0E5DE; border-radius: var(--r-sm);
  padding: 16px 22px; display: flex; align-items: center; gap: 16px;
  margin-bottom: 34px; border: 2px solid #D4BEC8;
}
.pav {
  width: 44px; height: 44px; border-radius: 50%;
  background: #C06C7E; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; flex-shrink: 0;
}
.pnm { font-size: 16px; font-weight: 700; color: #4A3040; }
.pmt { font-size: 15px; color: #7B6079; }
.eln { margin-left: auto; font-size: 16px; color: #7B6079; cursor: pointer; border: none; background: none; font-family: inherit; font-weight: 700; }
.eln:hover { color: #4A3040; }

.cat-section { margin-bottom: 32px; padding: 0 2px; }
.cat-label-pill {
  display: block; font-size: 16px; font-weight: 900; padding: 9px 24px;
  border-radius: 40px; letter-spacing: .04em; margin-bottom: 14px;
  width: fit-content;
}
.sub-label-pill {
  display: block; font-size: 15px; font-weight: 700; padding: 7px 20px;
  border-radius: 40px; margin: 10px 0 12px; width: fit-content;
}
.pc-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; padding-left: 4px; }
.pc {
  background: var(--card); border-radius: var(--r-sm);
  border: 2.5px solid var(--border); padding: 14px 20px; text-align: center;
  cursor: pointer; transition: all .18s; box-shadow: var(--sh); min-width: 110px;
}
.pc-ipa { font-size: 18px; font-weight: 700; color: var(--ink); }

/* ── TASK ── */
.task-outer { max-width: 720px; margin: 0 auto; }
.task-phoneme-label { text-align: center; font-size: 26px; font-weight: 900; color: var(--ink2); margin-bottom: 18px; }
.bulbs { display: flex; justify-content: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.bulb {
  width: 64px; height: 64px; border-radius: 50%;
  border: 4px solid var(--border); background: var(--card); transition: all .35s;
  display: flex; align-items: center; justify-content: center;
}
.bulb.lit { background: #F4D06F; border-color: #c4a030; box-shadow: 0 0 12px rgba(244,208,111,.8); }
.bulb.lit::after { content: '★'; color: #4A3040; font-size: 26px; }
.dino-area { text-align: center; margin-bottom: 26px; user-select: none; }
.speech-bub {
  display: inline-block; background: #F5EEFA; border: 3px solid #D4BEC8;
  border-radius: 18px 18px 18px 4px; padding: 9px 22px;
  font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 10px;
}
.dino-click { cursor: pointer; display: inline-block; transition: transform .18s; }
.dino-click:hover { transform: scale(1.07); }
.dino-click.playing { animation: dbounce .45s ease-in-out infinite alternate; }
@keyframes dbounce { from{transform:translateY(0)} to{transform:translateY(-10px)} }
.dino-click img, .dino-default { width: 150px; height: 150px; object-fit: contain; border-radius: 20px; display: block; }
.dino-default { background: #eeeeff; display: flex; align-items: center; justify-content: center; font-size: 84px; border: 3px solid #D4BEC8; }
.need-play { font-size: 16px; color: #C06C7E; text-align: center; min-height: 24px; margin-bottom: 10px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 680px; margin: 0 auto; }
.cbtn {
  background: var(--card); border: 3px solid var(--border);
  border-radius: var(--r); padding: 20px; cursor: pointer;
  transition: all .18s; box-shadow: var(--sh);
  display: flex; align-items: center; justify-content: center; min-height: 280px;
}
.cbtn:hover { transform: translateY(-3px); box-shadow: var(--shh); border-color: #7B6079; }
.cbtn.chosen { border-color: #C06C7E; background: #EFC4CC; transform: scale(.97); }
.cimg { width: 220px; height: 220px; border-radius: 20px; overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.cimg img { width: 100%; height: 100%; object-fit: cover; }

/* ── RESULTS ── */
.sec-label-res { font-size: 16px; font-weight: 700; color: #7B6079; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px; padding-left: 2px; }
.stats-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.rc3 { background: var(--card); border-radius: 12px; border: 2px solid var(--border); padding: 16px 14px; text-align: center; }
.rc3-label { font-size: 14px; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
.rc3-val { font-size: 28px; font-weight: 900; color: #4A3040; line-height: 1; }
.rc3-sub { font-size: 16px; color: var(--ink3); margin-top: 5px; }
.rc3-val.pink { color: #C06C7E; }

.scale-card-new { background: var(--card); border-radius: 14px; border: 2px solid var(--border); padding: 22px 28px; margin-bottom: 20px; }
.scale-endpoints { display: flex; justify-content: space-between; margin-bottom: 20px; }
.ep-word { font-size: 20px; font-weight: 900; color: #4A3040; }
.scale-track { position: relative; height: 28px; display: flex; align-items: center; margin: 0 14px 12px; }
.scale-rail { position: absolute; left:0; right:0; height:10px; background:#EDE5E9; border-radius:5px; }
.scale-fill-a { position:absolute; left:0; height:10px; background:#EFC4CC; border-radius:5px 0 0 5px; }
.scale-fill-b { position:absolute; right:0; height:10px; background:#BBDCD8; border-radius:0 5px 5px 0; }
.scale-dots-row { position:absolute; left:0; right:0; display:flex; justify-content:space-between; align-items:center; }
.sd {
  width: 28px; height: 28px; border-radius: 50%; border: 3px solid #D4BEC8; background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #B09AA8; z-index: 2; flex-shrink:0;
}
.sd.ans-a { background:#EFC4CC; border-color:#C06C7E; color:#7a2030; }
.sd.ans-b { background:#BBDCD8; border-color:#5E8F8A; color:#2a5e5a; }
.sd.no-score { background:#f0ece8; border-color:#c8b8b0; color:#bbb; }
.sd.star-a { width:36px;height:36px;font-size:18px;background:#EFC4CC;border-color:#C06C7E;border-width:3px;box-shadow:0 0 0 5px rgba(192,108,126,.18);color:#C06C7E; }
.sd.star-b { width:36px;height:36px;font-size:18px;background:#BBDCD8;border-color:#5E8F8A;border-width:3px;box-shadow:0 0 0 5px rgba(94,143,138,.18);color:#5E8F8A; }
.scale-nums { display:flex; justify-content:space-between; margin:0 14px; }
.snum { font-size:14px; font-weight:700; color:#B09AA8; width:28px; text-align:center; }
.snum.no-score { color:#c8b8b0; }
.snum.sa { color:#C06C7E; font-weight:900; font-size:15px; }
.snum.sb { color:#5E8F8A; font-weight:900; font-size:15px; }

.trial-card-new { background:var(--card); border-radius:14px; border:2px solid var(--border); overflow:hidden; margin-bottom:20px; }
.trow { display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr; padding:11px 14px; border-bottom:1px solid #F5F0F2; font-size: 16px; text-align:center; align-items:center; }
.trow:last-child { border-bottom:none; }
.trow.thdr { font-size: 14px; font-weight:700; color:#B09AA8; text-transform:uppercase; letter-spacing:.04em; background:#FAF7F9; border-bottom:2px solid #EDE5E9; padding:10px 14px; }
.trow.twrong { background:#fdf6f7; }
.trow.tskip { color:#B09AA8; }
.play-sm-btn { font-size:16px; padding:4px 13px; border-radius:20px; border:1.5px solid #5E8F8A; color:#5E8F8A; background:transparent; cursor:pointer; font-family:inherit; }
.play-sm-btn:hover { background:#BBDCD8; }

.replay-section { background:var(--card); border-radius:14px; border:2px solid var(--border); padding:18px 20px; margin-bottom:20px; }
.replay-title { font-size:16px; font-weight:700; color:#4A3040; margin-bottom:12px; }
.replay-item { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #F5F0F2; font-size:15px; }
.replay-dot { width:8px;height:8px;border-radius:50%;background:#c4a030;flex-shrink:0; }

.res-bar { background: #F0E5DE; border-radius: var(--r); padding: 22px 26px; margin-bottom: 24px; color: #4A3040; display: flex; align-items: center; gap: 16px; }
.rav { width: 56px; height: 56px; border-radius: 50%; background: #C06C7E; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: #fff; }
.rnm { font-size: 18px; font-weight: 700; color: #4A3040; }
.rmt { font-size: 14px; color: #6b6e9a; margin-top: 2px; }
.rbtns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
.rb { padding: 14px 26px; font-size: 16px; font-weight: 700; border-radius: 40px; border: 2.5px solid; cursor: pointer; font-family: inherit; transition: all .15s; }
.rb-g { border-color: var(--border); color: var(--ink2); background: transparent; }
.rb-g:hover { background: var(--bg); }

/* ── HISTORY ── */
.hwrap { background: var(--card); border-radius: var(--r); border: 2.5px solid var(--border); overflow: hidden; box-shadow: var(--sh); }
.hr { display: grid; min-width: 0; border-bottom: 2px solid var(--bg); padding: 16px 20px; font-size: 16px; cursor: pointer; transition: background .12s; align-items: center; }
.hr:last-child { border-bottom: none; }
.hr:hover { background: #EFC4CC22; }
.hr.hd { font-size: 16px; font-weight: 700; color: #B09AA8; text-transform: uppercase; letter-spacing: .05em; cursor: default; background: #F5F0F2; }
.hr.hd:hover { background: #F5F0F2; }
.ap { display: inline-block; font-size: 14px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
.a-hi { background: #BBDCD8; color: #2a5e5a; }
.a-mid { background: #FFF3D0; color: #7a5000; }
.a-lo  { background: #EFC4CC; color: #7a2030; }

/* ── EDIT ── */
.sec-hd { font-size: 16px; font-weight: 700; color: var(--ink2); margin-bottom: 10px; }
.edit-cat-nav { display: flex; gap: 10px; flex-wrap: wrap; }
.cat-nav-btn { padding: 13px 24px; font-size: 16px; font-weight: 700; border-radius: var(--r-sm); border: 3px solid transparent; cursor: pointer; font-family: inherit; transition: all .18s; }
.cat-nav-btn:hover { transform: translateY(-2px); box-shadow: var(--sh); }
.cat-nav-btn.active { box-shadow: var(--shh); transform: translateY(-2px); }
.sg-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.sg-tab { padding: 10px 20px; font-size: 15px; font-weight: 700; border-radius: 40px; border: 2.5px solid var(--border); cursor: pointer; font-family: inherit; background: var(--bg); color: var(--ink2); transition: all .15s; }
.sg-tab.active { border-color: #4A3040; background: #4A3040; color: #fff; }
.add-form { display: flex; gap: 10px; align-items: center; background: var(--card); border: 2px solid var(--border); border-radius: var(--r-sm); padding: 12px 16px; margin-top: 10px; }
.add-form input { flex: 1; padding: 10px 14px; font-size: 16px; border: 2px solid var(--border); border-radius: var(--r-xs); font-family: inherit; outline: none; background: var(--bg); color: var(--ink); }
.add-form-btn { padding: 10px 20px; font-size: 15px; font-weight: 700; background: #4A3040; color: #fff; border: none; border-radius: var(--r-xs); cursor: pointer; font-family: inherit; white-space: nowrap; }
.add-form-cancel { padding: 10px 16px; font-size: 15px; font-weight: 700; background: transparent; color: var(--ink2); border: 2px solid var(--border); border-radius: var(--r-xs); cursor: pointer; font-family: inherit; }
.toggle-add-btn { padding: 10px 20px; font-size: 15px; font-weight: 700; border: 2.5px dashed var(--border); border-radius: var(--r-sm); background: transparent; color: var(--ink3); cursor: pointer; font-family: inherit; transition: all .15s; }
.ecard { background: var(--card); border-radius: var(--r); border: 2.5px solid var(--border); padding: 22px; margin-bottom: 18px; box-shadow: var(--sh); }
.ehead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.etit { font-size: 18px; font-weight: 700; color: var(--ink); }
.edel { font-size: 15px; color: #C06C7E; border: none; background: none; cursor: pointer; font-family: inherit; font-weight: 600; }
.edel:hover { text-decoration: underline; }
.er { display: grid; gap: 14px; margin-bottom: 14px; }
.el { font-size: 16px; font-weight: 700; color: var(--ink2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
.ei { width: 100%; padding: 12px 15px; font-size: 16px; border: 2.5px solid var(--border); border-radius: var(--r-xs); background: var(--bg); color: var(--ink); font-family: inherit; outline: none; transition: border .15s; }
.eimgs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.eutile { border: 2.5px dashed var(--border); border-radius: var(--r-sm); padding: 14px; text-align: center; cursor: pointer; transition: all .15s; }
.eutile input[type=file] { display: none; }
.etl { font-size: 14px; color: var(--ink3); }
.etok { font-size: 14px; color: #1a6a1a; font-weight: 700; }
.eutile img { max-height: 52px; object-fit: contain; border-radius: 6px; display: block; margin: 0 auto 6px; }
.lvg { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px,1fr)); gap: 7px; }
.lvt { border: 2px solid var(--border); border-radius: 8px; padding: 7px 5px; text-align: center; cursor: pointer; transition: all .15s; background: var(--bg); }
.lvt input[type=file] { display: none; }
.ltn { font-size: 14px; font-weight: 700; color: var(--ink3); margin-bottom: 2px; }
.ltok { font-size: 11px; color: #1a6a1a; font-weight: 700; }
.lvt.hf { border-color: #60c5ba; background: #e2f5f4; }
.lvt-del { font-size: 10px; color: var(--asp-big); border: none; background: none; cursor: pointer; display: block; margin: 2px auto 0; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { font-size: 14px; padding: 6px 16px; border-radius: 20px; cursor: pointer; border: 2.5px solid var(--border); background: var(--bg); color: var(--ink2); font-family: inherit; transition: all .15s; }
.chip.skip-asp { background: #EFC4CC; color: #C06C7E; border-color: #C06C7E; }
.chip.skip-pos { background: #BBDCD8; color: #2a5e5a; border-color: #5E8F8A; }
.add-set-btn { width: 100%; padding: 15px; font-size: 16px; font-weight: 700; border: 2.5px dashed var(--border); border-radius: var(--r); background: transparent; color: var(--ink3); cursor: pointer; font-family: inherit; transition: all .15s; margin-bottom: 14px; }
.dino-up-tile { border: 2.5px dashed var(--border); border-radius: var(--r-sm); padding: 18px; text-align: center; cursor: pointer; transition: all .15s; margin-bottom: 24px; display: block; flex: 1; }
.dino-up-tile input[type=file] { display: none; }
.big-save-btn { padding: 18px 52px; font-size: 16px; font-weight: 700; background: #7B6079; color: #fff; border: none; border-radius: var(--r-sm); cursor: pointer; font-family: inherit; transition: all .18s; }

.site-footer {
  text-align: center;
  padding: 16px 20px 20px;
  color: #7B6079;
  font-family: 'Times New Roman', 'Noto Serif TC', serif;
  font-size: 14px;
  line-height: 1.7;
}
.site-footer div {
  font-family: 'Times New Roman', 'Noto Serif TC', serif;
}
.site-footer div:first-child { font-size: 14px; }
.site-footer div + div { margin-top: 2px; }

/* UI typography standardization — assessment report excluded */
.hr.hd { font-size: 14px; }
.trow.thdr { font-size: 14px; }
.fi, select, input, textarea, button { font-size: 17px; }

/* ── FINAL UI TYPOGRAPHY & RESPONSIVE POLISH ──
   Assessment report styles are intentionally excluded. */
.hr > div { min-width: 0; }
.hr.hd > div { white-space: nowrap; }
.hr > div { overflow: hidden; text-overflow: ellipsis; }
.hr > div:nth-child(8) { white-space: nowrap; overflow: visible; text-overflow: clip; min-width: 125px; }
.hr.hd > div:nth-child(8) { white-space: nowrap; overflow: visible; text-overflow: clip; min-width: 125px; }
.site-footer,
.site-footer div,
.site-footer div:first-child,
.site-footer div + div {
  font-size: 14px;
  line-height: 1.7;
}

/* Operational UI scale */
.fl { font-size: 16px; }
.fi, select, input, textarea, button { font-size: 17px; }
.trow { font-size: 16px; }
.trow.thdr { font-size: 14px; }
.sec-hd { font-size: 20px; }

/* Keep compact helper/status text readable without enlarging it. */
.upload-status, .hint, .help-text { font-size: 13px; }

@media (max-width: 1024px) {

<script>

];

const DEFAULT_SETS = [
  {id:'p-ph-ang', catId:'cat_asp',sgId:'sg_stop',bopomofo:'ㄅㄤ/ㄆㄤ',ipa:'[paŋ] / [pʰaŋ]', levels:7,skip:[4],reps:1,wordA:'棒子',wordB:'胖子'},

  {id:'t-th-u',   catId:'cat_asp',sgId:'sg_stop',bopomofo:'ㄉㄨ/ㄊㄨ',ipa:'[tu] / [tʰu]', levels:7,skip:[4],reps:1,wordA:'肚子',wordB:'兔子'},
  {id:'t-th-i',   catId:'cat_asp',sgId:'sg_stop',bopomofo:'ㄉㄧ/ㄊㄧ',ipa:'[ti] / [tʰi]', levels:7,skip:[4],reps:1,wordA:'樓低',wordB:'樓梯'},
  
  {id:'tc-tch-ie',catId:'cat_asp',sgId:'sg_affr',bopomofo:'ㄐㄧㄝ/ㄑㄧㄝ',ipa:'[tɕie] / [tɕʰie]', levels:7,skip:[4],reps:1,wordA:'街道',wordB:'切到'},
  {id:'tc-tch-i', catId:'cat_asp',sgId:'sg_affr',bopomofo:'ㄐㄧ/ㄑㄧ',ipa:'[tɕi] / [tɕʰi]', levels:7,skip:[4],reps:1,wordA:'黑雞',wordB:'黑漆'},
  {id:'ts-tsh-uo',catId:'cat_asp',sgId:'sg_affr',bopomofo:'ㄗㄨㄛ/ㄘㄨㄛ',ipa:'[tsuo] / [tsʰuo]', levels:7,skip:[4],reps:1,wordA:'作物',wordB:'錯誤'},

const BP = {'ㄅ':'p','ㄆ':'pʰ','ㄇ':'m','ㄈ':'f','ㄉ':'t','ㄊ':'tʰ','ㄋ':'n','ㄌ':'l','ㄍ':'k','ㄎ':'kʰ','ㄏ':'x','ㄐ':'tɕ','ㄑ':'tɕʰ','ㄒ':'ɕ','ㄓ':'ʈʂ','ㄔ':'ʈʂʰ','ㄕ':'ʂ','ㄖ':'ʐ','ㄗ':'ts','ㄘ':'tsʰ','ㄙ':'s','ㄧ':'i','ㄨ':'u','ㄩ':'y','ㄚ':'a','ㄛ':'o','ㄜ':'ə','ㄝ':'e','ㄞ':'aɪ','ㄟ':'eɪ','ㄠ':'aʊ','ㄡ':'oʊ','ㄢ':'an','ㄣ':'ən','ㄤ':'aŋ','ㄥ':'əŋ','ㄦ':'ɚ'};
function b2i(str){ return str.split('/').map(seg=>{ const t=seg.trim(); if(!t)return''; return '['+t.split('').map(c=>BP[c]||c).join('')+']'; }).join(' / '); }

// ── DYNAMIC COMPUTED CORRECT LOGIC ────────────────────────────────
function getComputedCorrect(def) {
  let a = [], b = [];
  const skip = def.skip || [];
  const n = parseInt(def.levels) || 7;
  let divider = skip.length ? Math.min(...skip) : Math.ceil(n/2);
  for(let i=1; i<=n; i++) {
    if(skip.includes(i)) continue;
    if(skip.length > 0) {
        if(i < divider) a.push(i);
        else b.push(i);
    } else {
        if(i <= Math.floor(n/2)) a.push(i);
        else b.push(i);
    }
  }
  return { A: a, B: b };
}

let dinoUrl = null;      
let dinoOpenUrl = null;  

let editDraft = { cats:[], sets:[] };
let catEditMode = false;
let histEditMode = false;
let editCatId = null, editSgId = null;
let lastTaskId = null;
let S = { def:null, trials:[], idx:0, results:[], startTime:null, answered:false, playCount:0, audio:null };

const shuffle  = a=>{for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const inits    = n=>n?n.slice(0,2).toUpperCase():'?';
const fmtD     = iso=>{const d=new Date(iso);return d.toLocaleDateString('zh-TW')+' '+d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});};
const isScored = (def,lv)=>!(def.skip||[]).includes(lv);

function fileToBase64(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => callback(e.target.result);
    reader.readAsDataURL(file);
}

// ── TABS ─────────────────────────────────────────────────────────
function switchTab(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const sc=document.getElementById('screen-'+name);
  if(sc) sc.classList.add('active');
  const tb=document.querySelector(`.tab[data-sc="${name}"]`);
  if(tb) tb.classList.add('active');
  if(name==='profile') loadPF();
  if(name==='home')    renderHome();
  if(name!=='edit'){ catEditMode=false; }
  if(name==='history') renderHistory();
  if(name==='edit')    renderEdit();
}

// ── JSON EXPORT / IMPORT ──────────────────────────────────────────
function exportJSONConfig() {
    const data = {
        version: DATA_VERSION, cats: allCats, sets: allSets,
        assets: userAssets, dinoClosed: dinoUrl, dinoOpen: dinoOpenUrl
    };
    const jsonStr = JSON.stringify(data);
    const a = document.createElement('a');
    a.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(jsonStr);
    a.download = `sdt_config_${Date.now()}.json`;
    a.click();
}

function importJSONConfig(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            allCats = data.cats || []; allSets = data.sets || [];
            userAssets = data.assets || {}; dinoUrl = data.dinoClosed || null;
            dinoOpenUrl = data.dinoOpen || null;
            renderEdit(); autosave(); alert("設定檔匯入成功！");
        } catch (err) { alert("檔案格式錯誤，無法匯入！"); }
        input.value = ""; 
    };
    reader.readAsText(file);
}

function calcAge() {
  const dobVal = document.getElementById('pf-dob').value;
  const display = document.getElementById('age-display');
  const hiddenAge = document.getElementById('pf-age');
  
  if(!dobVal) { 
    display.textContent = ''; 
    hiddenAge.value = ''; 
    return; 
  }
  
  const dob = new Date(dobVal);
  const today = new Date();
  
  let years = today.getFullYear() - dob.getFullYear();
  let months = today.getMonth() - dob.getMonth();
  
  if (today.getDate() < dob.getDate()) {
    months--;
  }
  if (months < 0) {
    years--;
    months += 12;
  }
  
  const ageStr = `${years}.${months}`;
  display.textContent = `(${ageStr} 歲)`;
  hiddenAge.value = ageStr;
}

// ── TASK ──────────────────────────────────────────────────────────
function startTask(id){
  const def=allSets.find(s=>s.id===id); if(!def) return;
  lastTaskId=id;
  const reps = parseInt(def.reps)||1;
  const baseTrials = Array.from({length:def.levels},(_,i)=>i+1);
  let allTrials = [];
  for(let r=0;r<reps;r++) allTrials = allTrials.concat([...baseTrials]);
  S={def,trials:shuffle(allTrials),idx:0,results:[],startTime:Date.now(),answered:false,playCount:0,audio:null};
  document.getElementById('bulbs').innerHTML=S.trials.map((_,i)=>`<div class="bulb" id="b${i}"></div>`).join('');
  document.getElementById('task-phoneme-label').textContent=def.ipa||b2i(def.bopomofo||'')||'';
  renderDino(false);
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('screen-task').classList.add('active');
  loadTrial();
}

function nextSetInSg(){
  const def = S.def; if(!def) return;
  const cat = allCats.find(c=>c.id===def.catId);
  const sg  = cat?.subgroups?.find(sg=>sg.id===def.sgId);
  if(!sg) { switchTab('home'); return; }
  const idx = sg.ids.indexOf(def.id);
  const nextId = sg.ids[idx+1];
  if(!nextId){ switchTab('home'); return; }
  startTask(nextId);
}
function retryTask(){if(lastTaskId)startTask(lastTaskId);}
function loadTrial(){
  S.answered=false;S.playCount=0;renderDino(false);
  document.getElementById('need-play').textContent='';
  document.getElementById('ch-A').className='cbtn';
  document.getElementById('ch-B').className='cbtn';
  const assets=userAssets[S.def.id]||{};
  ['A','B'].forEach(side=>{
    const el=document.getElementById('img-'+side);
    const url=side==='A'?assets.imgA:assets.imgB;
    if(url){el.innerHTML=`<img src="${url}" alt="">`;}
    else{el.innerHTML='';el.style.background='var(--bg)';}
  });
}
function playStimulus(){
  if(S.answered) return;
  S.playCount++;
  renderDino(true); 
  
  document.getElementById('need-play').textContent='';
  const lv=S.trials[S.idx];
  const assets=userAssets[S.def.id]||{};
  if(assets.audioLevels?.[lv]){
    if(S.audio){S.audio.pause();S.audio.currentTime=0;}
    S.audio=new Audio(assets.audioLevels[lv]);
    S.audio.play();
    S.audio.onended=()=>renderDino(false); 
  } else {
    if(!window.speechSynthesis) { renderDino(false); return; }
    const isA = getComputedCorrect(S.def).A.includes(lv);
    const word = isA ? (S.def.wordA||'A') : (S.def.wordB||'B');
    const u = new SpeechSynthesisUtterance(word); u.lang='zh-TW'; u.rate=.85;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    u.onend=()=>renderDino(false); 
  }
}
function selectChoice(c){
  if(S.answered) return;
  if(S.playCount===0){document.getElementById('need-play').textContent='請先聽聲音';return;}
  S.answered=true;
  document.getElementById('ch-'+c).className='cbtn chosen';
  const lv=S.trials[S.idx], def=S.def;
  const sc=isScored(def,lv);
  const comp = getComputedCorrect(def);
  const cc = comp.A.includes(lv) ? 'A' : (comp.B.includes(lv) ? 'B' : null);
  S.results.push({trial:S.idx+1,level:lv,choice:c,correctChoice:cc,isCorrect:c===cc,isScored:sc,replays:S.playCount-1});
  const b=document.getElementById('b'+S.idx);if(b)b.classList.add('lit');
  setTimeout(()=>{S.idx++;if(S.idx>=S.trials.length)showResults(false);else loadTrial();},380);
}

// ── RESULTS ───────────────────────────────────────────────────────
function calcScaleBoundary(results, def) {
  const comp = getComputedCorrect(def);
  const aSorted = results.filter(r=>comp.A.includes(r.level)&&r.isScored&&r.isCorrect).sort((a,b)=>b.level-a.level);
  const bSorted = results.filter(r=>comp.B.includes(r.level)&&r.isScored&&r.isCorrect).sort((a,b)=>a.level-b.level);
  return { starA: aSorted[0]?.level||null, starB: bSorted[0]?.level||null };
}

function renderScale(results, def) {
  const lvls = parseInt(def.levels)||7;
  const skip = def.skip||[];
  const comp = getComputedCorrect(def);
  const { starA, starB } = calcScaleBoundary(results, def);

  const dots = Array.from({length:lvls},(_,i)=>i+1).map(lv=>{
    const isSkip = skip.includes(lv);
    const r = results.find(x=>x.level===lv);
    const isA = comp.A.includes(lv);
    let cls = '';
    if(isSkip) cls='sd no-score';
    else if(lv===starA) cls='sd star-a';
    else if(lv===starB) cls='sd star-b';
    else if(r?.isCorrect && isA) cls='sd ans-a';
    else if(r?.isCorrect && !isA) cls='sd ans-b';
    else cls='sd';
    const inner = (lv===starA||lv===starB)?'★':(r?.isCorrect?'✓':(isSkip?'—':'✗'));
    return `<div class="${cls}">${inner}</div>`;
  }).join('');
  document.getElementById('sc-dots').innerHTML = dots;

  const nums = Array.from({length:lvls},(_,i)=>i+1).map(lv=>{
    const isSkip = skip.includes(lv);
    const cls = isSkip?'snum no-score':lv===starA?'snum sa':lv===starB?'snum sb':'snum';
    return `<span class="${cls}">${lv}</span>`;
  }).join('');
  document.getElementById('sc-nums').innerHTML = nums;

  const pct = (n) => ((n-1)/(lvls-1)*100).toFixed(1)+'%';
  if(starA) document.getElementById('sc-fill-a').style.width = pct(starA);
  if(starB) document.getElementById('sc-fill-b').style.width = ((lvls-starB)/(lvls-1)*100).toFixed(1)+'%';

  document.getElementById('sc-word-a').textContent = def.wordA||'A';
  document.getElementById('sc-word-b').textContent = def.wordB||'B';
}

function showResults(isReview){
  const def=S.def;
  const dur=Math.round((Date.now()-S.startTime)/1000);
  const sc=S.results.filter(r=>r.isScored);
  const cor=sc.filter(r=>r.isCorrect).length;
  const acc=sc.length?Math.round(cor/sc.length*100):0;
  const hiRp=S.results.filter(r=>r.replays>1);

  const n=profile.name||'未命名';
  document.getElementById('r-av').textContent=inits(n);
  document.getElementById('r-nm').textContent=n;
  const now=new Date();
  const titleStr=def.ipa||b2i(def.bopomofo||'');
  document.getElementById('r-mt').textContent=[titleStr,fmtD(now.toISOString()),[profile.gender,profile.age?profile.age+'歲':null,profile.school,profile.group].filter(Boolean).join('｜')].filter(Boolean).join(' ');

  document.getElementById('s-dur').textContent=dur;
  document.getElementById('s-acc').textContent=acc+'%';
  document.getElementById('s-acc-frac').textContent=cor+' / '+sc.length+' 題';
  document.getElementById('s-rpt').textContent=hiRp.length;

  renderScale(S.results, def);

  const trialEl = document.getElementById('trial-rows');
  trialEl.innerHTML = S.results.map((r,i)=>{
    const isSkip = !r.isScored;
    const wordShown = r.correctChoice==='A'?(def.wordA||'A'):r.correctChoice==='B'?(def.wordB||'B'):'—';
    const sym = isSkip ? '<span style="font-size:16px;color:#B09AA8">不計分</span>'
               : r.isCorrect ? '<span style="font-size:22px">⭕</span>'
               : '<span style="font-size:22px;color:#C06C7E">❌</span>';
    const assets = userAssets[def.id]||{};
    const hasAudio = !!(assets.audioLevels?.[r.level]);
    const playBtn = hasAudio ? `<button class="play-sm-btn" onclick="playErrAudio(${r.level})">▶ 播放</button>` : `<span style="color:#B09AA8;font-size:16px">無音檔</span>`;
    const rowCls = isSkip?'trow tskip':(!r.isCorrect?'trow twrong':'trow');
    return `<div class="${rowCls}">
      <div>${r.trial}</div>
      <div>${isSkip?'—':wordShown}</div>
      <div>${r.level}</div>
      <div>${sym}</div>
      <div>${playBtn}</div>
    </div>`;
  }).join('');

  const rb2=document.getElementById('rp-box'),rc=document.getElementById('rp-content');
  if(hiRp.length){
    rb2.style.display='block';
    rc.innerHTML=hiRp.map(r=>`<div class="replay-item"><div class="replay-dot"></div>第 ${r.trial} 題（階層 ${r.level}）重聽 ${r.replays} 次</div>`).join('');
  } else rb2.style.display='none';

  if(!isReview){
    const bnd = calcScaleBoundary(S.results, def);
    histList.unshift({date:now.toISOString(),taskId:def.id,title:titleStr,acc,
      boundary:bnd.starB||'—', dur,profile:{...profile},results:S.results});
    try{localStorage.setItem('sdt_hist',JSON.stringify(histList.slice(0,200)));}catch(e){}
  }

  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('screen-results').classList.add('active');
}

  const assets=userAssets[S.def.id]||{};if(!assets.audioLevels?.[lv])return;
  const btn=document.getElementById('peb-'+lv);
  if(errAudio){errAudio.pause();errAudio.currentTime=0;}
  errAudio=new Audio(assets.audioLevels[lv]);

// ── EXTRACT BOPOMOFO INITIALS ────────────────────────────────────
function extractInitials(bopoStr) {
  if (!bopoStr) return '—';
  const parts = bopoStr.split('/');
  const initList = ['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ'];
  const getInit = str => {
    str = str.trim();
    for (let ch of str) { if (initList.includes(ch)) return ch; }
    return str.charAt(0) || '—';
  };
  return `${getInit(parts[0])} / ${getInit(parts[1] || '')}`;
}

// ── REPORT GENERATION ────────────────────────────
function generateReport() {
  const rawPName = profile.name ? profile.name.trim() : '';
  const pName = rawPName || '未命名';
  
  const sessions = histList.filter(r => {
    const histName = (r.profile?.name || '').trim();
    return histName === pName;
  });

  if (!sessions.length) { 
    alert(`目前沒有受試者「${pName}」的測驗紀錄，請確認已完成測驗且名字相符。`); 
    return; 
  }

  const sorted = [...sessions].sort((a,b) => new Date(b.date) - new Date(a.date));
  const setMap = {};
  sorted.forEach(r => { if (!setMap[r.taskId]) setMap[r.taskId] = r; });

  const orderedIds = [
    'p-ph-ang','p-ph-ao','t-th-u','t-th-i',
    'tc-tch-ie','tc-tch-i','ts-tsh-uo','ts-tsh-ao',
    't-k-ai','t-k-ou'
  ];

  const phonemeData = orderedIds.map(id => {
    const def = allSets.find(s => s.id === id);
    const sess = setMap[id];
    if (!def || !sess) return null;
    const results = sess.results || [];
    const errLevels = [...new Set(results.filter(r=>r.isScored&&!r.isCorrect).map(r=>r.level))].sort((a,b)=>a-b);
    
    let catLabel = '';
    if (def.catId==='cat_asp'&&def.sgId==='sg_stop') catLabel='stop';
    else if (def.catId==='cat_asp'&&def.sgId==='sg_affr') catLabel='affr';
    else if (def.catId==='cat_pos') catLabel='pos';

    const bopoPair = extractInitials(def.bopomofo);
    const wordPair = `${def.wordA || 'A'} / ${def.wordB || 'B'}`;
    const numAcc = parseFloat(sess.acc) || 0;

    return { id, def, bopoPair, wordPair, acc: numAcc, errLevels, catLabel };
  }).filter(Boolean);

  if (!phonemeData.length) { alert('找不到對應的測驗資料，請確認已完成測驗。'); return; }

  // 1. 三組聲音分類
  const stableMap = new Map();     
  const transitionMap = new Map(); 
  const attentionMap = new Map();  

  phonemeData.forEach(p => {
    const key = p.bopoPair;
    const item = { bopo: p.bopoPair, words: p.wordPair };
    const has1or7 = p.errLevels.some(l => l === 1 || l === 7);
    const hasMid = p.errLevels.some(l => [3, 4, 5].includes(l));

    // 困難：< 70% 或 錯在 1 或 7
    if (p.acc < 70 || has1or7) {
      if (!attentionMap.has(key)) attentionMap.set(key, item);
    } 
    // 易混淆：70-90% 或 錯在 3,4,5
    else if ((p.acc >= 70 && p.acc < 90) || hasMid) {
      if (!transitionMap.has(key)) transitionMap.set(key, item);
    } 
    // 精確：>= 90% 或 全對
    else if (p.acc >= 90 || p.errLevels.length === 0) {
      if (!stableMap.has(key)) stableMap.set(key, item);
    }
  });

  const stableSounds = Array.from(stableMap.values());
  const transitionSounds = Array.from(transitionMap.values());
  const attentionSounds = Array.from(attentionMap.values());

  // 2. 正確率防呆計算
  const avgAcc = arr => {
    if (!arr.length) return null;
    const sum = arr.reduce((s, p) => s + (parseFloat(p.acc) || 0), 0);
    return Math.round(sum / arr.length);
  };

  const overallAcc = avgAcc(phonemeData) || 0;
  const stopAvg  = avgAcc(phonemeData.filter(p=>p.catLabel==='stop'));
  const affrAvg  = avgAcc(phonemeData.filter(p=>p.catLabel==='affr'));
  const posAvg   = avgAcc(phonemeData.filter(p=>p.catLabel==='pos'));

  const reportDate = new Date().toLocaleDateString('zh-TW');
  const html = buildReportHTML({ 
    profile, 
    overallAcc, 
    stableSounds, 
    transitionSounds, 
    attentionSounds, 
    stopAvg, 
    affrAvg, 
    posAvg, 
    reportDate 
  });

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
}

  // 甜甜圈動態比例優化：外推半徑，收斂線寬，避免三位數被截斷
  const R = 55, CX = 70, CY = 70, SW = 12;
  const circ = +(2 * Math.PI * R).toFixed(2);
  const safeAcc = Math.min(100, Math.max(0, parseInt(overallAcc) || 0));

    font-family: 'Inter', 'Noto Serif TC', serif;
  }

  .profile-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: #FCFAFB;
    border: 1.5px solid var(--ui-border);
    border-radius: 12px;
    padding: 10px 18px;
  }
  .p-col {
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-right: 1px solid #ECE1E6;
    padding: 0 14px;
  }
  .p-col:last-child { border-right: none; }
  .p-lbl { font-size: 13px; color: var(--ui-purple); font-weight: 600; }
  .p-val { font-size: 18px; color: var(--ui-dark); font-weight: 800; }

  /* 核心區塊外框 */
  .sec-container {
    border: 1.2px solid var(--ui-border);
    border-radius: 16px;
    padding: 15px 18px;
    background: #FFFFFF;
  }
  .sec-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .sec-num {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--ui-purple);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 800;
    font-family: 'Inter', serif;
  }
  .sec-title-box h2 {
    font-size: 21px;
    font-weight: 900;

  .sec-subtitle {
    font-size: 13.5px;

  /* 第一區：4 欄網格 */
  .grid-part1 {
    display: grid;
    grid-template-columns: 240px repeat(3, 1fr);
    gap: 12px;
    margin-top: 6px;
  }
  .donut-card {
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    border-radius: 14px;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;

  }
  .donut-title-text {
    font-size: 14px;

    margin-bottom: 4px;
  }
  
  /* 甜甜圈容器修復：避免三位數被圓環內框遮擋 */
  .donut-wrap-box {
    position: relative;
    width: 124px;
    height: 124px;
    margin: 4px auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .donut-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .donut-center-number {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: 900;
    color: var(--ui-dark);
    font-family: 'Inter', serif;
    letter-spacing: -0.03em;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  .donut-status-title {
    font-size: 19px;
    font-weight: 900;
    color: var(--ui-dark);
    margin-bottom: 3px;
  }
  .donut-status-desc {
    font-size: 12px;
    color: var(--ui-purple);
    line-height: 1.5;
  }

  /* 第一區 聲音分類卡片 */
  .sound-group-card {
    border-radius: 14px;
    border: 1.2px solid;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
  }
  .card-top-tag {
    font-size: 22px; 
    font-weight: 900;
    margin-bottom: 4px;
    text-align: center;
  }
  .card-lead-text {
    font-size: 13.5px;
    line-height: 1.4;
    margin-bottom: 10px;
    text-align: center;
    white-space: nowrap;
  }
  .sound-list-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .sound-row-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 2px;
    border-bottom: 1px dashed rgba(74, 48, 64, 0.1);
  }
  .sound-row-item:last-child { border-bottom: none; }
  .sound-bopo-text {
    font-size: 20px; 
    font-weight: 900;
    letter-spacing: 0.04em;
  }
  .sound-words-text {
    font-size: 16.5px; 
    color: var(--ui-purple);
    font-weight: 500;
  }
  .sound-empty-hint {
    font-size: 15px;
    color: var(--ui-purple);
    text-align: center;
    margin-top: 25px;
  }

  /* 精確：構音位置湖水灰綠系調配 */
  .card-green {
    background: #F2F8F7;
    border-color: var(--pos-sub);
    color: var(--pos-sub-text);
  }
  .card-green .sound-bopo-text { color: var(--pos-sub-text); }

  /* 易混淆：點綴明亮黃系調配 */
  .card-yellow {
    background: #FFF9EC;
    border-color: var(--ui-yellow);
    color: #8C6A10;
  }
  .card-yellow .sound-bopo-text { color: #8C6A10; }

  /* 困難：送氣向度珊瑚粉霧系調配 */
  .card-red {
    background: #FDF4F6;
    border-color: var(--asp-sub);
    color: var(--asp-sub-text);
  }
  .card-red .sound-bopo-text { color: var(--asp-sub-text); }

  .tip-banner {
    background: var(--ui-bg);
    border-radius: 10px;
    padding: 9px 14px;
    margin-top: 10px;
    font-size: 13px;
    color: var(--ui-dark);
    line-height: 1.5;
  }

  /* 第二區：3 欄向度卡片（防重疊與數值切角優化） */
  .grid-part2 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-top: 6px;
  }
  .dim-feature-card {
    border: 1.2px solid;
    border-radius: 14px;
    padding: 16px 18px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .dim-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 10px;
  }
  .dim-badge-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px; 
    font-weight: 800;
    color: #FFF;
    text-align: center;
    line-height: 1.2;
    flex-shrink: 0;
  }
  .dim-score-box {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    min-width: 90px;
    text-align: right;
  }
  .dim-score-lbl { 
    font-size: 13px; 
    color: var(--ui-purple); 
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 2px;
  }
  .dim-score-val {
    font-size: 32px;
    font-weight: 900;
    font-family: 'Inter', serif;
    line-height: 1;
    display: block;
  }
  .dim-subname {
    font-size: 18px;
    font-weight: 900;
    margin-bottom: 6px;
  }
  .dim-desc-p {
    font-size: 14.5px;
    line-height: 1.65;
    margin-bottom: 12px;
  }
  .dim-bottom-age {
    font-size: 16px;
    font-weight: 800;
    text-align: center;
    border-top: 1px dashed rgba(74, 48, 64, 0.15);
    padding-top: 8px;
  }

  .card-dim-asp {
    background: #FDF5F6;
    border-color: var(--asp-sub);
    color: var(--asp-sub-text);
  }
  .card-dim-asp .dim-badge-circle { background: var(--asp-big); }
  .card-dim-asp .dim-score-val { color: var(--asp-sub-text); }
  .card-dim-asp .dim-subname { color: var(--asp-big); }
  .card-dim-asp .dim-bottom-age { color: var(--asp-sub-text); }

  .card-dim-mid {
    background: #F9F6F8;
    border-color: var(--ui-border);
    color: var(--ui-dark);
  }
  .card-dim-mid .dim-badge-circle { background: var(--ui-purple); }
  .card-dim-mid .dim-score-val { color: var(--ui-dark); }
  .card-dim-mid .dim-subname { color: var(--ui-purple); }
  .card-dim-mid .dim-bottom-age { color: var(--ui-dark); }

  .card-dim-pos {
    background: #F2F8F7;
    border-color: var(--pos-sub);
    color: var(--pos-sub-text);
  }
  .card-dim-pos .dim-badge-circle { background: var(--pos-big); }
  .card-dim-pos .dim-score-val { color: var(--pos-sub-text); }
  .card-dim-pos .dim-subname { color: var(--pos-big); }
  .card-dim-pos .dim-bottom-age { color: var(--pos-sub-text); }

  /* 第三區：3 欄 Q&A 卡片 */
  .grid-part3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-top: 6px;
  }
  .qa-card {
    background: #FDFBFC;
    border: 1px solid var(--ui-border);
    border-radius: 12px;
    padding: 13px 15px;
  }
  .qa-q-line {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .qa-q-tag {
    background: var(--ui-purple);
    color: #FFF;
    font-size: 13px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 4px;
    font-family: 'Inter', serif;
  }
  .qa-q-title {
    font-size: 16px;
    font-weight: 900;
    color: var(--ui-dark);
  }
  .qa-a-body {
    font-size: 14px;
    color: #5A4553;
    line-height: 1.65;
  }

  /* 頁尾 */
  .report-footer {
    text-align: center;
    font-size: 12px;
    color: var(--ui-purple);
    border-top: 1px solid var(--ui-border);
    padding-top: 6px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="report-canvas">

  <!-- 列印按鈕 -->
  <div class="no-print">
    <button class="print-btn" onclick="window.print()">列印 / 儲存 PDF</button>
  </div>

  <!-- Header -->
  <div class="header-box">
    <div class="main-title">語音辨識訓練系統評估結果</div>
    <div class="date-badge">評估日期：${reportDate}</div>
  </div>

  <!-- 個人基本資料 -->
  <div class="profile-strip">
    <div class="p-col"><span class="p-lbl">姓名</span><span class="p-val">${pName}</span></div>
    <div class="p-col"><span class="p-lbl">性別</span><span class="p-val">${pGender}</span></div>
    <div class="p-col"><span class="p-lbl">年齡</span><span class="p-val">${pAge}</span></div>
    <div class="p-col"><span class="p-lbl">組別</span><span class="p-val">${pGroup}</span></div>
  </div>

  <!-- 01｜可以分辨出哪些聲音？ -->
  <div class="sec-container">
    <div class="sec-header">
      <div class="sec-num">01</div>
      <div class="sec-title-box">
        <h2>可以分辨出哪些聲音？</h2>
        <div class="sec-subtitle">以下分成三類說明，協助您了解孩子目前的語音辨識表現。</div>
      </div>
    </div>

    <div class="grid-part1">
      <!-- 甜甜圈卡片 -->
      <div class="donut-card">
        <div class="donut-title-text">整體語音辨識正確率</div>
        <div class="donut-wrap-box">
          <svg class="donut-svg" viewBox="0 0 140 140">
            <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#EDE5E9" stroke-width="${SW}"/>
            <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--ui-purple)" stroke-width="${SW}"
              stroke-dasharray="${filled} ${circ}"
              stroke-linecap="round"/>
          </svg>
          <div class="donut-center-number">${safeAcc}%</div>
        </div>
        <div class="donut-status-title">${overallTitle}</div>
        <div class="donut-status-desc">${overallDesc}</div>
      </div>

      <!-- 綠色卡片：精確 (湖水灰綠專屬調配) -->
      <div class="sound-group-card card-green">
        <div class="card-top-tag">精確</div>
        <div class="card-lead-text">能分辨相似語音的細微差異</div>
        <div class="sound-list-box">
          ${renderSoundList(stableSounds, '無此類別')}
        </div>
      </div>

      <!-- 黃色卡片：易混淆 (點綴明亮黃專屬調配) -->
      <div class="sound-group-card card-yellow">
        <div class="card-top-tag">易混淆</div>
        <div class="card-lead-text">偶爾在細微差異中出現混淆</div>
        <div class="sound-list-box">
          ${renderSoundList(transitionSounds, '無此類別')}
        </div>
      </div>

      <!-- 紅色卡片：困難 (珊瑚粉霧專屬調配) -->
      <div class="sound-group-card card-red">
        <div class="card-top-tag">困難</div>
        <div class="card-lead-text">無法辨識語音中的明顯差異</div>
        <div class="sound-list-box">
          ${renderSoundList(attentionSounds, '無此類別')}
        </div>
      </div>
    </div>

    <div class="tip-banner">
      <strong>小提醒：</strong>聲音差異比較接近時，偶爾分不清楚是常見的發展過程；如果連差異明顯的聲音也經常分不清楚，則建議進一步了解。
    </div>
  </div>

  <!-- 02｜這些聲音差在哪裡呢？ -->
  <div class="sec-container">
    <div class="sec-header">
      <div class="sec-num">02</div>
      <div class="sec-title-box">
        <h2>這些聲音差在哪裡呢？</h2>
        <div class="sec-subtitle">有些聲音聽起來很像，差別藏在氣流的時間、摩擦聲，或舌頭的位置。這些能力會隨著年齡與語音經驗逐漸發展。</div>
      </div>
    </div>

    <div class="grid-part2">
      <!-- 塞音卡片（送氣向度專用色） -->
      <div class="dim-feature-card card-dim-asp">
        <div>
          <div class="dim-header-row">
            <div class="dim-badge-circle">塞音</div>
            <div class="dim-score-box">
              <div class="dim-score-lbl">正確率</div>
              <div class="dim-score-val">${stopAvg !== null ? stopAvg + '%' : '—'}</div>
            </div>
          </div>
          <div class="dim-subname">ㄅ／ㄆ、ㄉ／ㄊ</div>
          <div class="dim-desc-p">在說話時，仔細觀察這些聲音，會發現氣流從嘴巴噴發出來的效果不一樣，例如：說「棒」的氣流比較短，「胖」的氣流比較長。約 4 歲後，孩子會逐漸掌握這類聲音的差異。</div>
        </div>
        <div class="dim-bottom-age">4歲後習得</div>
      </div>

      <!-- 塞擦音卡片（輔色藕紫灰） -->
      <div class="dim-feature-card card-dim-mid">
        <div>
          <div class="dim-header-row">
            <div class="dim-badge-circle">塞擦音</div>
            <div class="dim-score-box">
              <div class="dim-score-lbl">正確率</div>
              <div class="dim-score-val">${affrAvg !== null ? affrAvg + '%' : '—'}</div>
            </div>
          </div>
          <div class="dim-subname">ㄐ／ㄑ、ㄗ／ㄘ</div>
          <div class="dim-desc-p">這些聲音都會有一小段帶有摩擦感覺「嘶嘶聲」，差別在於氣流通過口腔時間的長短。例如：「街」和「切」，雖然兩個聲音很像，但「ㄑ」氣流感覺會比「ㄐ」更多一些。約 5 歲後，孩子會逐漸掌握這類聲音的差異。</div>
        </div>
        <div class="dim-bottom-age">5歲後習得</div>
      </div>

      <!-- 構音位置卡片（構音位置向度專用色） -->
      <div class="dim-feature-card card-dim-pos">
        <div>
          <div class="dim-header-row">
            <div class="dim-badge-circle">舌頭<br>位置</div>
            <div class="dim-score-box">
              <div class="dim-score-lbl">正確率</div>
              <div class="dim-score-val">${posAvg !== null ? posAvg + '%' : '—'}</div>
            </div>
          </div>
          <div class="dim-subname">ㄉ／ㄍ</div>
          <div class="dim-desc-p">這兩個聲音的差異是舌頭位置的不同，說「ㄉ」的時候，舌頭會靠近「牙齒」；說「ㄍ」的時候，會靠近「軟齶」。有時出現把「阿公」說成「阿東」，就是不小心讓舌頭從後面跑到前面了！若在 4 歲之後，仍頻繁的出現此類型的錯誤，建議尋求專業人員的評估和協助。</div>
        </div>
        <div class="dim-bottom-age">3歲後習得</div>
      </div>
    </div>
  </div>

  <!-- 03｜給家長的話 -->
  <div class="sec-container" style="padding-bottom: 12px;">
    <div class="sec-header" style="margin-bottom: 4px;">
      <div class="sec-num">03</div>
      <div class="sec-title-box">
        <h2>給家長的話</h2>
      </div>
    </div>

    <div class="grid-part3">
      <!-- Q1 -->
      <div class="qa-card">
        <div class="qa-q-line">
          <span class="qa-q-tag">Q1</span>
          <span class="qa-q-title">聽聲音跟說話有什麼關係？</span>
        </div>
        <div class="qa-a-body">
          孩子在學說話時，不只是「把音說出來」，也需要先能聽出不同音之間的差異。當能分辨相似的聲音，會更有助於建立正確的語音表徵，進一步支持發音的學習。
        </div>
      </div>

      <!-- Q2 -->
      <div class="qa-card">
        <div class="qa-q-line">
          <span class="qa-q-tag">Q2</span>
          <span class="qa-q-title">這次的聽辨表現代表什麼？</span>
        </div>
        <div class="qa-a-body">
          這份結果主要反映孩子目前分辨相似聲音的能力，並不代表孩子的智力、語言理解或整體學習能力。聽辨能力也會隨著年齡與語音經驗逐漸發展，因此部分語音分辨得不穩定時，不一定代表有問題，有可能是還在發展的階段，需要搭配孩子的年齡與日常說話表現來判斷。
        </div>
      </div>

      <!-- Q3 -->
      <div class="qa-card">
        <div class="qa-q-line">
          <span class="qa-q-tag">Q3</span>
          <span class="qa-q-title">如果孩子有聽辨問題該怎麼辦？</span>
        </div>
        <div class="qa-a-body">
          如果只有少數聲音偶爾分不清楚，可以先在日常生活中多讓孩子「聽一聽、比一比」，例如把兩個相似的詞放在一起讓孩子聽聽看。如果孩子在明顯差異的聲音上都經常分辨困難，也影響到日常說話的清晰度，則可以進一步諮詢語言治療師或專業人員，了解孩子目前的語音發展情況。
        </div>
      </div>
    </div>
  </div>

  <!-- 頁尾 -->
  <div class="report-footer">
    <div>本報告由語音辨識訓練系統自動產生，僅供參考，不構成正式診斷。若有任何疑問建議諮詢相關專業人員。</div>
    <div>Speech Discrimination Training System © 2026</div>
    <div>Hsi Yueh Tzu · National Kaohsiung Normal University</div>
  </div>

</div>
</body>
</html>`;
}
